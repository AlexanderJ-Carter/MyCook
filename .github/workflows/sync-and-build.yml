# 从 fork 拉取 → 同步 → 构建 → 校验 → 发布到 GitHub Pages
name: Sync & Build

on:
    push:
        branches: [main]
    schedule:
        - cron: '0 2 * * *' # 每天 UTC 2:00（北京 10:00）
    workflow_dispatch:
        inputs:
            skip_images:
                description: '跳过图片版构建（加快手动调试）'
                type: boolean
                default: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sync-and-build:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout MyCook
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Clone upstream repos with retry
              env:
                  GIT_LFS_SKIP_SMUDGE: '1'
              run: |
                  clone_with_retry() {
                    local repo=$1 dest=$2 branch=${3:-main}
                    for i in 1 2 3; do
                      echo "→ clone $repo ($branch) attempt $i"
                      rm -rf "$dest"
                      if git clone --depth 1 --branch "$branch" "$repo" "$dest"; then
                        echo "✓ cloned $repo"
                        return 0
                      fi
                      echo "attempt $i failed, retry in 8s..."
                      sleep 8
                    done
                    return 1
                  }
                  clone_with_retry https://github.com/AlexanderJ-Carter/CookLikeHOC.git upstream/CookLikeHOC main \
                    || clone_with_retry https://github.com/Gar-b-age/CookLikeHOC.git upstream/CookLikeHOC main
                  clone_with_retry https://github.com/AlexanderJ-Carter/HowToCook.git upstream/HowToCook master \
                    || clone_with_retry https://github.com/Anduin2017/HowToCook.git upstream/HowToCook master
                  if [ "${{ github.event.inputs.skip_images }}" != "true" ]; then
                    clone_with_retry https://github.com/king-jingxiang/HowToCook.git upstream/HowToCookImages master || true
                  fi

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --prefer-offline --no-audit

            - name: Sync upstream content
              env:
                  COOKLIKEHOC_PATH: ${{ github.workspace }}/upstream/CookLikeHOC
                  HOWTOCOOK_PATH: ${{ github.workspace }}/upstream/HowToCook
                  HOWTOCOOK_IMAGES_PATH: ${{ github.workspace }}/upstream/HowToCookImages
                  SYNC_PULL: '0'
                  VITEPRESS_BASE: /
              run: node scripts/sync-upstream.js

            - name: Build site
              env:
                  COOKLIKEHOC_PATH: ${{ github.workspace }}/upstream/CookLikeHOC
                  HOWTOCOOK_PATH: ${{ github.workspace }}/upstream/HowToCook
                  HOWTOCOOK_IMAGES_PATH: ${{ github.workspace }}/upstream/HowToCookImages
                  SYNC_PULL: '0'
                  VITEPRESS_BASE: /
                  SKIP_IMAGES: ${{ github.event.inputs.skip_images == 'true' && '1' || '0' }}
              run: |
                  if [ "$SKIP_IMAGES" = "1" ]; then
                    npm run docs:build:fast
                  else
                    npm run docs:build
                  fi

            - name: Validate artifacts
              env:
                  MYCOOK_DATA: .vitepress/dist
              run: npm run validate

            - name: Verify build output
              run: |
                  test -f .vitepress/dist/index.html
                  test -f .vitepress/dist/stats.json
                  test -f .vitepress/dist/recipes-index.json
                  test -f .vitepress/dist/tips-index.json
                  test -f .vitepress/dist/sitemap.xml
                  test -f .vitepress/dist/.well-known/mcp/server-card.json
                  echo "dist OK: $(find .vitepress/dist -type f | wc -l) files"

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: .vitepress/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Summary
              run: |
                  echo "### Pages deployed" >> "$GITHUB_STEP_SUMMARY"
                  echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Recipes: $(node -e "console.log(require('./.vitepress/dist/stats.json').total)")" >> "$GITHUB_STEP_SUMMARY"
