name: Docker Build & Push

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:
        inputs:
            variant:
                description: '站点镜像变体'
                type: choice
                options:
                    - lite
                    - full
                    - both
                default: lite
            include_mcp:
                description: '同时构建 MCP sidecar 镜像'
                type: boolean
                default: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    REGISTRY: ghcr.io

permissions:
    contents: read
    packages: write

jobs:
    build-lite:
        if: github.event_name != 'workflow_dispatch' || inputs.variant != 'full'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker meta (lite)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mycook
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
                      type=raw,value=lite,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
                      type=sha,prefix=
                      type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: SKIP_IMAGES=1
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=mycook-lite
                  cache-to: type=gha,mode=max,scope=mycook-lite
                  platforms: linux/amd64

    build-full:
        if: github.event_name == 'workflow_dispatch' && (inputs.variant == 'full' || inputs.variant == 'both')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: SKIP_IMAGES=0
                  tags: |
                      ${{ env.REGISTRY }}/${{ github.repository_owner }}/mycook:full
                  cache-from: type=gha,scope=mycook-full
                  cache-to: type=gha,mode=max,scope=mycook-full
                  platforms: linux/amd64

    build-mcp:
        if: |
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
            (github.event_name == 'workflow_dispatch' && inputs.include_mcp)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker meta (mcp)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mycook-mcp
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
                      type=sha,prefix=
                      type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.mcp
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=mycook-mcp
                  cache-to: type=gha,mode=max,scope=mycook-mcp
                  platforms: linux/amd64
