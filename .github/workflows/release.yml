# 推送 v* tag 时创建 GitHub Release（Docker 镜像由 docker.yml 同 tag 触发）
name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve version
              id: ver
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  body: |
                      ## 在线访问

                      [cook.alexander.xin](https://cook.alexander.xin)

                      ## Docker

                      ```bash
                      docker pull ghcr.io/${{ github.repository_owner }}/mycook:${{ steps.ver.outputs.tag }}
                      docker pull ghcr.io/${{ github.repository_owner }}/mycook-mcp:${{ steps.ver.outputs.tag }}
                      ```

                      详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) · [DOCKER.md](https://github.com/${{ github.repository }}/blob/main/DOCKER.md)

                      > Pages 在 push `main` 时自动部署；**打 tag 才会构建并推送 GHCR 镜像**。
