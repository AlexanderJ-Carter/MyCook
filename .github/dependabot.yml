version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      groups:
          vitepress-ecosystem:
              patterns:
                  - vitepress
                  - vite
                  - vue
                  - '@vue/*'
      labels:
          - dependencies

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - docker
