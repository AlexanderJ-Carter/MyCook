# MyCook Docker Compose
#
# 默认 lite（构建时跳过 howtocook-images，省 CI/体积）
# 完整版（含图片）: docker compose --profile full up -d --build
# 生产 cloud:       见 deploy/cloud（pull :full，不在此机构建）
# 开发:             docker compose --profile dev up

services:
  mycook:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COOKLIKEHOC_BRANCH: main
        HOWTOCOOK_BRANCH: master
        SKIP_IMAGES: "1"
    image: mycook:lite
    container_name: mycook
    ports:
      - "${Mycook_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mycook-full:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COOKLIKEHOC_BRANCH: main
        HOWTOCOOK_BRANCH: master
        SKIP_IMAGES: "0"
    image: mycook:full
    container_name: mycook-full
    ports:
      - "${Mycook_PORT:-8080}:80"
    restart: unless-stopped

  mycook-dev:
    profiles: [dev]
    image: node:22-alpine
    container_name: mycook-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      SYNC_PULL: "0"
    command: sh -c "npm install && npm run sync && npm run docs:dev -- --host 0.0.0.0"

  mycook-mcp:
    profiles: [agent]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: mycook-mcp:latest
    container_name: mycook-mcp
    ports:
      - "${MCP_PORT:-3001}:3001"
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-0}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      MCP_API_KEYS: ${MCP_API_KEYS:-}
    restart: unless-stopped
