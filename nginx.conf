server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/markdown image/svg+xml;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    map $http_accept $agent_markdown {
        default 0;
        "~*text/markdown" 1;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/jwks.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/agent-skills/index.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/mcp/server-card.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = /index.md {
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~ ^/(about|help|auth)\.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~ ^/(.+)\.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /howtocook-images/ {
        try_files $uri $uri/ /howtocook-images/index.html;
    }

    location / {
        if ($agent_markdown) {
            rewrite ^/$ /index.md last;
        }
        if ($agent_markdown) {
            rewrite ^/([^./]+)/?$ /$1.md last;
        }
        if ($agent_markdown) {
            rewrite ^/(.*)/$ /$1.md last;
        }
        if ($agent_markdown) {
            rewrite ^/(.*)$ /$1.md last;
        }

        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/json", </help>; rel="service-doc"; type="text/html", </.well-known/agent-skills/index.json>; rel="describedby", </.well-known/mcp/server-card.json>; rel="describedby"' always;
        try_files $uri $uri/ $uri.html /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
